name: StoryGen CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Environment variables will be set dynamically from config file

jobs:
  validate:
    name: Validate six-scene contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python tools/sync_workshop.py --check
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/story-contract.test.mjs
      - run: npm ci --no-audit --no-fund
        working-directory: 04b_Manual_Deployment_Done/frontend
      - run: npx tsc --noEmit --pretty false
        working-directory: 04b_Manual_Deployment_Done/frontend
      - run: npm run build
        working-directory: 04b_Manual_Deployment_Done/frontend
      - run: node tests/render-story-frames.mjs

  setup-infrastructure:
    name: Setup Infrastructure
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load deployment configuration
        uses: ./.github/actions/load-config

      - name: Validate configuration
        run: |
          echo "🔍 Validating configuration..."
          echo "✅ Configuration loaded from .github/config/deployment.yml:"
          echo "  Project ID: $PROJECT_ID"
          echo "  Region: $REGION"
          echo "  Service Account: $SERVICE_ACCOUNT_EMAIL"
          echo "  Backend Service: $BACKEND_SERVICE_NAME"
          echo "  Frontend Service: $FRONTEND_SERVICE_NAME"
          echo "  Bucket: $BUCKET_NAME"
          echo "  Secret: $SECRET_NAME"

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Enable required APIs
        run: |
          echo "🔧 Enabling required Google Cloud APIs..."
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            aiplatform.googleapis.com \
            storage.googleapis.com \
            secretmanager.googleapis.com \
            cloudbilling.googleapis.com \
            --project=${{ env.PROJECT_ID }}

      - name: Setup Artifact Registry
        run: |
          echo "🏗️ Setting up Artifact Registry..."
          if ! gcloud artifacts repositories describe ${{ env.ARTIFACT_REPO }} \
               --location=${{ env.REGION }} \
               --project=${{ env.PROJECT_ID }} &>/dev/null; then
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create ${{ env.ARTIFACT_REPO }} \
              --repository-format=docker \
              --location=${{ env.REGION }} \
              --description="Docker repository for StoryGen application" \
              --project=${{ env.PROJECT_ID }}
          else
            echo "✅ Artifact Registry repository already exists"
          fi
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Setup Storage Bucket
        run: |
          echo "🪣 Setting up Storage Bucket..."
          if ! gsutil ls "gs://${{ env.BUCKET_NAME }}" &>/dev/null; then
            echo "Creating storage bucket..."
            gsutil mb -p ${{ env.PROJECT_ID }} -l ${{ env.REGION }} "gs://${{ env.BUCKET_NAME }}"
            # Keep generated images private. The app uses signed URLs or inline fallback.
          else
            echo "✅ Storage bucket already exists"
          fi

      - name: Verify Secret Manager secret
        run: |
          # Provision the key outside GitHub Actions. Never store API keys in
          # repository variables, workflow YAML, logs, or build arguments.
          if ! gcloud secrets describe "${{ env.SECRET_NAME }}" \
               --project="${{ env.PROJECT_ID }}" >/dev/null; then
            echo "Missing Secret Manager secret. Follow SETUP.md before deploying."
            exit 1
          fi
          if ! gcloud secrets versions list "${{ env.SECRET_NAME }}" \
               --project="${{ env.PROJECT_ID }}" \
               --filter="state=ENABLED" --format="value(name)" | grep -q .; then
            echo "Secret has no enabled version. Add one securely using SETUP.md."
            exit 1
          fi

  build-and-deploy-backend:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    needs: setup-infrastructure
    permissions:
      contents: read
      id-token: write
    outputs:
      backend-url: ${{ steps.deploy-backend.outputs.backend-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load deployment configuration
        uses: ./.github/actions/load-config

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push backend Docker image
        run: |
          echo "🔨 Building backend Docker image..."
          cd 04b_Manual_Deployment_Done/backend
          gcloud builds submit \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:latest \
            --project=${{ env.PROJECT_ID }}
          echo "✅ Backend image built and pushed successfully"

      - name: Deploy backend to Cloud Run
        id: deploy-backend
        run: |
          echo "📦 Deploying backend to Cloud Run..."
          
          gcloud run deploy ${{ env.BACKEND_SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:latest \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --session-affinity \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT_ID=${{ env.PROJECT_ID }}" \
            --set-env-vars="GENMEDIA_BUCKET=${{ env.BUCKET_NAME }}" \
            --set-env-vars="GOOGLE_GENAI_USE_VERTEXAI=FALSE" \
            --set-env-vars="GOOGLE_CLOUD_REGION=${{ env.REGION }}" \
            --set-env-vars="STORY_MODEL=${{ env.STORY_MODEL }}" \
            --set-env-vars="IMAGE_MODEL=${{ env.IMAGE_MODEL }}" \
            --timeout=600 \
            --set-secrets="GOOGLE_API_KEY=${{ env.SECRET_NAME }}:latest" \
            --memory=${{ env.BACKEND_MEMORY }} \
            --cpu=${{ env.BACKEND_CPU }} \
            --min-instances=${{ env.MIN_INSTANCES }} \
            --max-instances=${{ env.MAX_INSTANCES }} \
            --project=${{ env.PROJECT_ID }}

          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --format="value(status.url)" \
            --project=${{ env.PROJECT_ID }})

          echo "✅ Backend deployed successfully!"
          echo "🔗 Backend URL: $BACKEND_URL"
          echo "backend-url=$BACKEND_URL" >> $GITHUB_OUTPUT

  build-and-deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs: [setup-infrastructure, build-and-deploy-backend]
    permissions:
      contents: read
      id-token: write
    outputs:
      frontend-url: ${{ steps.deploy-frontend.outputs.frontend-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load deployment configuration
        uses: ./.github/actions/load-config

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push frontend Docker image
        run: |
          echo "🔨 Building frontend Docker image..."
          BACKEND_URL="${{ needs.build-and-deploy-backend.outputs.backend-url }}"
          echo "🔗 Using backend URL: $BACKEND_URL"
          
          cd 04b_Manual_Deployment_Done/frontend
          # NEXT_PUBLIC_* must be a Docker build argument, not just a runtime env var.
          FRONTEND_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions="_BACKEND_URL=${BACKEND_URL},_IMAGE_NAME=${FRONTEND_IMAGE}" \
            --project=${{ env.PROJECT_ID }}
          echo "✅ Frontend image built and pushed successfully"

      - name: Deploy frontend to Cloud Run
        id: deploy-frontend
        run: |
          echo "🚀 Deploying frontend to Cloud Run..."
          BACKEND_URL="${{ needs.build-and-deploy-backend.outputs.backend-url }}"
          
          gcloud run deploy ${{ env.FRONTEND_SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.FRONTEND_IMAGE_NAME }}:latest \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=3000 \
            --set-env-vars="NEXT_PUBLIC_BACKEND_URL=$BACKEND_URL" \
            --memory=${{ env.FRONTEND_MEMORY }} \
            --cpu=${{ env.FRONTEND_CPU }} \
            --min-instances=${{ env.MIN_INSTANCES }} \
            --max-instances=${{ env.MAX_INSTANCES }} \
            --project=${{ env.PROJECT_ID }}

          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE_NAME }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --format="value(status.url)" \
            --project=${{ env.PROJECT_ID }})

          echo "✅ Frontend deployed successfully!"
          echo "🌐 Frontend URL: $FRONTEND_URL"
          echo "frontend-url=$FRONTEND_URL" >> $GITHUB_OUTPUT

  health-check:
    name: Health Check & Validation
    runs-on: ubuntu-latest
    needs: [build-and-deploy-backend, build-and-deploy-frontend]
    permissions:
      contents: read
    steps:
      - name: Test Backend Health
        run: |
          echo "🏥 Testing backend health..."
          BACKEND_URL="${{ needs.build-and-deploy-backend.outputs.backend-url }}"
          
          if [ -z "$BACKEND_URL" ]; then
            echo "❌ Backend URL not available"
            exit 1
          fi
          
          echo "Testing backend at: $BACKEND_URL"
          for i in {1..5}; do
            echo "Attempt $i/5..."
            HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health" || echo "000")
            
            if [ "$HEALTH_RESPONSE" = "200" ]; then
              echo "✅ Backend health check passed"
              curl -s "$BACKEND_URL/health"
              break
            else
              echo "⚠️ Backend health check failed (HTTP $HEALTH_RESPONSE)"
              if [ $i -eq 5 ]; then
                echo "❌ Backend health check failed after 5 attempts"
                exit 1
              fi
              echo "Retrying in 30 seconds..."
              sleep 30
            fi
          done

      - name: Test Frontend Accessibility
        run: |
          echo "🌐 Testing frontend accessibility..."
          FRONTEND_URL="${{ needs.build-and-deploy-frontend.outputs.frontend-url }}"
          
          if [ -z "$FRONTEND_URL" ]; then
            echo "❌ Frontend URL not available"
            exit 1
          fi
          
          echo "Testing frontend at: $FRONTEND_URL"
          FRONTEND_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || echo "000")
          
          if [ "$FRONTEND_RESPONSE" = "200" ]; then
            echo "✅ Frontend accessibility check passed"
          else
            echo "❌ Frontend accessibility check failed (HTTP $FRONTEND_RESPONSE)"
            echo "Retrying in 30 seconds..."
            sleep 30
            FRONTEND_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || echo "000")
            if [ "$FRONTEND_RESPONSE" = "200" ]; then
              echo "✅ Frontend accessibility check passed on retry"
            else
              echo "❌ Frontend accessibility check failed on retry (HTTP $FRONTEND_RESPONSE)"
              exit 1
            fi
          fi

      - name: Display Deployment Summary
        run: |
          echo ""
          echo "🎉 Deployment Complete!"
          echo "======================="
          echo ""
          echo "📋 Configuration Used:"
          echo "  Project ID: ${{ env.PROJECT_ID }}"
          echo "  Region: ${{ env.REGION }}"
          echo "  Backend Service: ${{ env.BACKEND_SERVICE_NAME }}"
          echo "  Frontend Service: ${{ env.FRONTEND_SERVICE_NAME }}"
          echo "  Bucket: ${{ env.BUCKET_NAME }}"
          echo "  Secret: ${{ env.SECRET_NAME }}"
          echo ""
          echo "📋 Service URLs:"
          echo "🔗 Backend:  ${{ needs.build-and-deploy-backend.outputs.backend-url }}"
          echo "🌐 Frontend: ${{ needs.build-and-deploy-frontend.outputs.frontend-url }}"
          echo ""
          echo "📋 Next Steps:"
          echo "1. Visit your application at the Frontend URL"
          echo "2. Verify the connection indicator shows 'Connected'"
          echo "3. Test story generation functionality"